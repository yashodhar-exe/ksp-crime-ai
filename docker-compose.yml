version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ksp_crime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # backend:
  #   build: ./deployment/docker/backend.Dockerfile
  #   depends_on: [db]
  #   ports: ["8000:8000"]
  # frontend:
  #   build: ./deployment/docker/frontend.Dockerfile
  #   ports: ["3000:3000"]
volumes:
  pgdata:
